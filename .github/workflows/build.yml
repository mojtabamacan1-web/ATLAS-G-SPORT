name: Build ATLAS G SPORT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/makan/atlasgsport
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ATLAS-G-SPORT"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.makan.atlasgsport'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.makan.atlasgsport'
                  minSdk 23
                  targetSdk 29
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="ATLAS G SPORT"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00D5FF</item>
                  <item name="android:statusBarColor">#080D14</item>
                  <item name="android:navigationBarColor">#080D14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/makan/atlasgsport/MainActivity.java <<'EOF'
          package com.makan.atlasgsport;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.*;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              LinearLayout page;
              TextView clock;

              int cyan = Color.rgb(0,213,255);
              int white = Color.WHITE;

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER_HORIZONTAL);
                  page.setPadding(28,30,28,24);
                  page.setBackgroundColor(Color.rgb(8,13,20));

                  TextView brand = new TextView(this);
                  brand.setText("ATLAS G SPORT");
                  brand.setTextColor(cyan);
                  brand.setTextSize(27);
                  brand.setTypeface(null, Typeface.BOLD);
                  brand.setGravity(Gravity.CENTER);
                  page.addView(brand);

                  TextView edition = new TextView(this);
                  edition.setText("MAKAN EDITION | SAIPA ATLAS G");
                  edition.setTextColor(Color.LTGRAY);
                  edition.setTextSize(12);
                  edition.setGravity(Gravity.CENTER);
                  page.addView(edition);

                  clock = new TextView(this);
                  clock.setTextColor(white);
                  clock.setTextSize(42);
                  clock.setGravity(Gravity.CENTER);
                  clock.setPadding(0,35,0,0);
                  page.addView(clock);

                  TextView date = new TextView(this);
                  date.setText(new SimpleDateFormat("EEEE, dd MMMM yyyy", Locale.getDefault()).format(new Date()));
                  date.setTextColor(Color.LTGRAY);
                  date.setTextSize(15);
                  date.setGravity(Gravity.CENTER);
                  page.addView(date);

                  TextView car = new TextView(this);
                  car.setText("\nSAIPA ATLAS G\n\nSPORT • DRIVE • ENJOY");
                  car.setTextColor(white);
                  car.setTextSize(23);
                  car.setTypeface(null, Typeface.BOLD);
                  car.setGravity(Gravity.CENTER);
                  car.setPadding(0,28,0,28);
                  page.addView(car);

                  TextView speed = new TextView(this);
                  speed.setText("GPS SPEED\n-- km/h");
                  speed.setTextColor(cyan);
                  speed.setTextSize(21);
                  speed.setGravity(Gravity.CENTER);
                  speed.setPadding(0,10,0,24);
                  page.addView(speed);

                  addButton("نقشه و مسیریابی", () -> open("geo:0,0?q=Yazd"));
                  addButton("موزیک", () -> openMusic());
                  addButton("تنظیمات", () -> openSettings());

                  TextView footer = new TextView(this);
                  footer.setText("ATLAS G SPORT • VERSION 1.0");
                  footer.setTextColor(Color.GRAY);
                  footer.setTextSize(10);
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0,22,0,0);
                  page.addView(footer);

                  setContentView(page);
                  updateClock();
              }

              void updateClock() {
                  clock.setText(new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date()));
                  clock.postDelayed(() -> updateClock(), 30000);
              }

              void addButton(String label, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(white);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(25,39,54)));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,62);
                  p.setMargins(0,8,0,8);
                  page.addView(b,p);
                  b.setOnClickListener(v -> action.run());
              }

              void open(String uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(uri)));
                  } catch(Exception e) {
                      Toast.makeText(this,"برنامه نقشه نصب نیست",Toast.LENGTH_SHORT).show();
                  }
              }

              void openMusic() {
                  try {
                      Intent i = new Intent("android.intent.action.MAIN");
                      i.addCategory("android.intent.category.APP_MUSIC");
                      startActivity(i);
                  } catch(Exception e) {
                      Toast.makeText(this,"برنامه موسیقی پیدا نشد",Toast.LENGTH_SHORT).show();
                  }
              }

              void openSettings() {
                  try {
                      startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS));
                  } catch(Exception e) {
                      Toast.makeText(this,"تنظیمات در دسترس نیست",Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
    accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-G-SPORT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
