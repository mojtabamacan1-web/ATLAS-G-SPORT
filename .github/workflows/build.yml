
name: Build ATLAS G SPORT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/atlasg/sport
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          test -f app/src/main/res/drawable/atlas_car.webp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ATLAS-G-SPORT"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.atlasg.sport'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.atlasg.sport'
                  minSdk 23
                  targetSdk 29
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:allowBackup="true"
                  android:label="ATLAS G SPORT"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/atlasg/sport/MainActivity.java <<'EOF'
          package com.atlasg.sport;

          import android.app.*;
          import android.os.*;
          import android.Manifest;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.location.*;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          import java.util.Locale;
          import java.text.SimpleDateFormat;
          import java.util.Date;

          public class MainActivity extends Activity implements LocationListener {

              Dashboard dashboard;
              LocationManager locationManager;
              String speedText = "--";
              boolean gpsReady = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  dashboard = new Dashboard(this);
                  setContentView(dashboard);

                  locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  checkGpsPermission();
              }

              void checkGpsPermission() {
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED) {
                      startGps();
                  } else {
                      requestPermissions(
                          new String[]{Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION}, 101);
                  }
              }

              void startGps() {
                  try {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) return;

                      locationManager.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER, 1000, 0, this);

                      gpsReady = true;
                  } catch (Exception e) {
                      gpsReady = false;
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  if (location.hasSpeed()) {
                      speedText = String.valueOf(Math.round(location.getSpeed() * 3.6f));
                  } else {
                      speedText = "0";
                  }
                  if (dashboard != null) dashboard.invalidate();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode,
                      String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(requestCode, permissions, results);
                  if (requestCode == 101 && results.length > 0
                          && results[0] == PackageManager.PERMISSION_GRANTED) {
                      startGps();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED) startGps();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  try {
                      if (locationManager != null) locationManager.removeUpdates(this);
                  } catch (Exception ignored) {}
              }

              void openMaps() {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0?q=ایران"));
                      startActivity(i);
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openMusic() {
                  try {
                      Intent i = new Intent("android.intent.action.MAIN");
                      i.addCategory("android.intent.category.APP_MUSIC");
                      startActivity(i);
                  } catch (Exception e) {
                      new AlertDialog.Builder(this)
                          .setTitle("موزیک")
                          .setMessage("برنامه پخش موسیقی روی دستگاه پیدا نشد.")
                          .setPositiveButton("باشه", null).show();
                  }
              }

              void openApps() {
                  try {
                      Intent i = new Intent(Settings.ACTION_MANAGE_APPLICATIONS_SETTINGS);
                      startActivity(i);
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openSettings() {
                  try {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  } catch (Exception ignored) {}
              }

              void showAbout() {
                  new AlertDialog.Builder(this)
                      .setTitle("ATLAS G SPORT")
                      .setMessage("نسخه 2.0\n\nطراحی اختصاصی رابط کاربری اطلس G\n\nتیم طراحی مهندس زارع")
                      .setPositiveButton("بستن", null)
                      .show();
              }

              class Dashboard extends View {

                  Paint p = new Paint(3);
                  Bitmap car;
                  int cream = Color.rgb(232, 218, 188);
                  int gold = Color.rgb(190, 157, 99);
                  int black = Color.rgb(10, 11, 12);
                  int panel = Color.rgb(24, 24, 23);
                  int muted = Color.rgb(151, 145, 132);
                  float sx, sy;
                  float W, H;
                  long lastUpdate = 0;

                  Dashboard(Context context) {
                      super(context);
                      setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                      try {
                          car = BitmapFactory.decodeResource(getResources(),
                              R.drawable.atlas_car);
                      } catch (Exception ignored) {}
                  }

                  void paint(int color, float size) {
                      p.setColor(color);
                      p.setTextSize(size);
                      p.setTypeface(Typeface.create("sans-serif", Typeface.NORMAL));
                      p.setStyle(Paint.Style.FILL);
                  }

                  void text(Canvas c, String value, float x, float y,
                            int color, float size, Paint.Align align) {
                      paint(color, size);
                      p.setTextAlign(align);
                      c.drawText(value, x, y, p);
                  }

                  void round(Canvas c, float l, float t, float r, float b,
                             float radius, int color) {
                      paint(color, 1);
                      c.drawRoundRect(l, t, r, b, radius, radius, p);
                  }

                  void line(Canvas c, float x1, float y1, float x2, float y2,
                            int color, float width) {
                      paint(color, width);
                      p.setStrokeWidth(width);
                      p.setStyle(Paint.Style.STROKE);
                      c.drawLine(x1, y1, x2, y2, p);
                      p.setStyle(Paint.Style.FILL);
                  }

                  void drawCar(Canvas c, float l, float t, float r, float b) {
                      if (car != null) {
                          float bw = car.getWidth();
                          float bh = car.getHeight();
                          float scale = Math.min((r-l)/bw, (b-t)/bh);
                          float dw = bw * scale;
                          float dh = bh * scale;
                          float x = l + ((r-l)-dw)/2;
                          float y = t + ((b-t)-dh)/2;
                          paint(Color.WHITE, 1);
                          p.setFilterBitmap(true);
                          c.drawBitmap(car, null,
                              new RectF(x, y, x+dw, y+dh), p);
                      } else {
                          text(c, "ATLAS G", (l+r)/2, (t+b)/2,
                              cream, 35, Paint.Align.CENTER);
                      }
                  }

                  void tire(Canvas c, float x, float y, String name) {
                      round(c, x-38, y-25, x+38, y+25, 12, black);
                      line(c, x-24, y-12, x+24, y-12, gold, 2);
                      text(c, name, x, y+5, cream, 13, Paint.Align.CENTER);
                      text(c, "— —", x, y+42, muted, 12, Paint.Align.CENTER);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      W = getWidth();
                      H = getHeight();

                      canvas.drawColor(black);

                      boolean landscape = W > H;
                      float pad = Math.min(W,H) * 0.025f;
                      float top = H * (landscape ? 0.12f : 0.09f);
                      float bottom = H * (landscape ? 0.16f : 0.17f);

                      // Top bar
                      round(canvas, pad, pad, W-pad, top-pad/3, 18, panel);
                      text(canvas, "ATLAS G", pad*2, top*0.68f,
                          cream, Math.min(25,H*0.035f), Paint.Align.LEFT);
                      text(canvas, "SPORT", pad*2+95, top*0.68f,
                          gold, Math.min(17,H*0.025f), Paint.Align.LEFT);

                      String time = new SimpleDateFormat("HH:mm", Locale.getDefault())
                          .format(new Date());
                      String date = new SimpleDateFormat("yyyy/MM/dd", Locale.getDefault())
                          .format(new Date());

                      text(canvas, date, W/2, top*0.68f, muted,
                          Math.min(15,H*0.022f), Paint.Align.CENTER);
                      text(canvas, time, W-pad*2, top*0.68f,
                          cream, Math.min(25,H*0.035f), Paint.Align.RIGHT);

                      float middleTop = top + pad;
                      float middleBottom = H - bottom - pad;

                      if (landscape) {
                          float left = W*0.19f;
                          float right = W*0.81f;

                          // Left information panel
                          round(canvas, pad, middleTop, left-pad, middleBottom,
                              18, panel);
                          text(canvas, "اطلاعات خودرو", left/2, middleTop+35,
                              cream, 17, Paint.Align.CENTER);
                          line(canvas, pad*2, middleTop+48, left-pad*2,
                              middleTop+48, gold, 1.5f);

                          text(canvas, "سرعت خودرو", left/2, middleTop+85,
                              muted, 14, Paint.Align.CENTER);
                          text(canvas, speedText + " km/h", left/2,
                              middleTop+135, cream, 28, Paint.Align.CENTER);
                          text(canvas, gpsReady ? "GPS فعال" : "در انتظار GPS",
                              left/2, middleTop+165, gold, 12, Paint.Align.CENTER);

                          text(canvas, "آب‌وهوا", left/2, middleTop+220,
                              cream, 16, Paint.Align.CENTER);
                          text(canvas, "نیازمند اتصال اینترنت",
                              left/2, middleTop+250, muted, 11, Paint.Align.CENTER);

                          // Main car area
                          round(canvas, left, middleTop, right, middleBottom,
                              20, panel);
                          text(canvas, "SAIPA ATLAS G", W/2, middleTop+34,
                              gold, 16, Paint.Align.CENTER);
                          drawCar(canvas, left+10, middleTop+45,
                              right-10, middleBottom-15);

                          // Right TPMS panel
                          round(canvas, right+pad, middleTop, W-pad,
                              middleBottom, 18, panel);
                          text(canvas, "فشار باد لاستیک", (right+W)/2,
                              middleTop+35, cream, 16, Paint.Align.CENTER);
                          text(canvas, "نمایش آزمایشی", (right+W)/2,
                              middleTop+57, gold, 11, Paint.Align.CENTER);

                          float cx = (right+W)/2;
                          tire(canvas, cx, middleTop+115, "FL");
                          tire(canvas, cx, middleTop+205, "RL");
                      } else {
                          // Portrait test layout
                          round(canvas, pad, middleTop, W-pad,
                              middleBottom, 18, panel);
                          text(canvas, "سرعت  " + speedText + " km/h",
                              W/2, middleTop+32, cream, 19, Paint.Align.CENTER);
                          text(canvas, "GPS: " + (gpsReady ? "فعال" : "در انتظار"),
                              W/2, middleTop+57, gold, 12, Paint.Align.CENTER);
                          drawCar(canvas, pad+10, middleTop+65,
                              W-pad-10, middleBottom-125);
                          text(canvas, "TPMS  |  نمایش آزمایشی",
                              W/2, middleBottom-70, gold, 13, Paint.Align.CENTER);
                          text(canvas, "FL  —       FR  —",
                              W/2, middleBottom-45, cream, 12, Paint.Align.CENTER);
                          text(canvas, "RL  —       RR  —",
                              W/2, middleBottom-23, cream, 12, Paint.Align.CENTER);
                      }

                      // Bottom navigation dock
                      float dockTop = H-bottom;
                      round(canvas, pad, dockTop, W-pad, H-pad/2, 18, panel);

                      String[] labels = {"نقشه", "موزیک", "برنامه‌ها",
                          "تنظیمات", "درباره"};
                      float[] centers = new float[5];

                      for (int i=0; i<5; i++) {
                          centers[i] = W*(i+0.5f)/5f;
                          round(canvas, centers[i]-W*0.075f, dockTop+8,
                              centers[i]+W*0.075f, H-pad, 12,
                              i==0 ? Color.rgb(55,46,32) : black);
                          text(canvas, labels[i], centers[i],
                              dockTop+(H-dockTop)*0.65f, cream,
                              Math.min(16,H*0.025f), Paint.Align.CENTER);
                      }

                      if (System.currentTimeMillis()-lastUpdate > 1000) {
                          lastUpdate = System.currentTimeMillis();
                          postInvalidateDelayed(1000);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(android.view.MotionEvent event) {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          float x = event.getX();
                          float y = event.getY();
                          float dockTop = H - H*0.16f;

                          if (y > dockTop) {
                              int item = Math.min(4, Math.max(0,
                                  (int)(x / (W/5f))));
                              switch(item) {
                                  case 0: openMaps(); break;
                                  case 1: openMusic(); break;
                                  case 2: openApps(); break;
                                  case 3: openSettings(); break;
                                  case 4: showAbout(); break;
                              }
                          }
                          return true;
                      }
                      return true;
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-G-SPORT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
