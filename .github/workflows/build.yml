name: Build ATLAS G SPORT APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build with Gradle Wrapper
        run: |
          # پیدا کردن خودکار مسیر gradlew در کل مخزن
          GRADLEW_FILE=$(find . -name "gradlew" -type f -print -quit)
          if [ -n "$GRADLEW_FILE" ]; then
            DIR_NAME=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in: $DIR_NAME"
            cd "$DIR_NAME"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-G-SPORT-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
