
name: Build ATLAS G SPORT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/makan/atlas
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ATLAS-G-SPORT"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.makan.atlas'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.makan.atlas'
                  minSdk 23
                  targetSdk 29
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="ATLAS G SPORT"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00D9FF</item>
                  <item name="android:statusBarColor">#080B12</item>
                  <item name="android:navigationBarColor">#080B12</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#080B12</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/makan/atlas/MainActivity.java <<'EOF'
          package com.makan.atlas;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.content.Intent;
          import android.net.Uri;
          import android.text.format.DateFormat;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              TextView clock;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(24, 24, 24, 24);
                  root.setBackgroundColor(Color.rgb(8, 11, 18));

                  TextView title = new TextView(this);
                  title.setText("ATLAS G");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(38);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, 1);
                  root.addView(title);

                  TextView edition = new TextView(this);
                  edition.setText("SPORT  |  MAKAN EDITION");
                  edition.setTextColor(Color.rgb(0, 217, 255));
                  edition.setTextSize(15);
                  edition.setGravity(Gravity.CENTER);
                  root.addView(edition);

                  clock = new TextView(this);
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(30);
                  clock.setGravity(Gravity.CENTER);
                  clock.setPadding(0, 30, 0, 10);
                  root.addView(clock);

                  updateClock();

                  TextView speed = new TextView(this);
                  speed.setText("SPEED  |  -- km/h");
                  speed.setTextColor(Color.rgb(0, 217, 255));
                  speed.setTextSize(21);
                  speed.setGravity(Gravity.CENTER);
                  speed.setPadding(0, 15, 0, 30);
                  root.addView(speed);

                  addButton(root, "NAVIGATION", v ->
                      openApp("geo:0,0?q=Yazd"));

                  addButton(root, "MUSIC PLAYER", v ->
                      openMusic());

                  addButton(root, "ANDROID SETTINGS", v -> {
                      startActivity(new Intent(
                          android.provider.Settings.ACTION_SETTINGS));
                  });

                  TextView footer = new TextView(this);
                  footer.setText("SAIPA ATLAS G");
                  footer.setTextColor(Color.GRAY);
                  footer.setTextSize(12);
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0, 25, 0, 0);
                  root.addView(footer);

                  setContentView(root);
              }

              void addButton(LinearLayout root, String label,
                             View.OnClickListener listener) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(
                          Color.rgb(20, 35, 50)));
                  button.setOnClickListener(listener);

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 58);
                  params.setMargins(0, 8, 0, 8);
                  root.addView(button, params);
              }

              void updateClock() {
                  String time = new SimpleDateFormat(
                      "HH:mm", Locale.getDefault()).format(new Date());
                  String date = new SimpleDateFormat(
                      "yyyy/MM/dd", Locale.getDefault()).format(new Date());
                  clock.setText(time + "\n" + date);
              }

              void openApp(String uri) {
                  try {
                      Intent intent = new Intent(
                          Intent.ACTION_VIEW, Uri.parse(uri));
                      startActivity(intent);
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openMusic() {
                  Intent intent = new Intent(
                      "android.intent.action.MUSIC_PLAYER");
                  try {
                      startActivity(intent);
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openSettings() {
                  startActivity(new Intent(
                      android.provider.Settings.ACTION_SETTINGS));
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-G-SPORT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
