
name: Build ATLAS G SPORT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Check car image
        run: |
          if [ ! -f app/src/main/res/drawable/atlas_car.webp ]; then
            echo "ERROR: atlas_car.webp not found!"
            find app/src/main/res -maxdepth 3 -type f
            exit 1
          fi
          echo "Car image found successfully."

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/atlasg/sport
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ATLAS-G-SPORT"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.atlasg.sport'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.atlasg.sport'
                  minSdk 23
                  targetSdk 29
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:allowBackup="true"
                  android:label="ATLAS G SPORT"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/atlasg/sport/MainActivity.java <<'EOF'
          package com.atlasg.sport;

          import android.app.*;
          import android.os.*;
          import android.Manifest;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.location.*;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import java.util.*;
          import java.text.*;

          public class MainActivity extends Activity implements LocationListener {

              Dashboard dashboard;
              LocationManager locationManager;
              String speedText = "--";
              boolean gpsReady = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  dashboard = new Dashboard(this);
                  setContentView(dashboard);

                  locationManager = (LocationManager)
                      getSystemService(LOCATION_SERVICE);

                  checkGpsPermission();
              }

              void checkGpsPermission() {
                  if (Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 101);
                  } else {
                      startGps();
                  }
              }

              void startGps() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) return;

                      locationManager.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER, 1000, 0, this);

                      gpsReady = true;
                  } catch (Exception e) {
                      gpsReady = false;
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  if (location.hasSpeed()) {
                      speedText = String.valueOf(
                          Math.round(location.getSpeed() * 3.6f));
                  } else {
                      speedText = "0";
                  }
                  if (dashboard != null) dashboard.invalidate();
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, results);

                  if (requestCode == 101 && results.length > 0 &&
                      results[0] == PackageManager.PERMISSION_GRANTED) {
                      startGps();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  startGps();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  try {
                      if (locationManager != null)
                          locationManager.removeUpdates(this);
                  } catch (Exception ignored) {}
              }

              void openMaps() {
                  try {
                      startActivity(new Intent(
                          Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=Iran")));
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openMusic() {
                  try {
                      Intent i = new Intent("android.intent.action.MAIN");
                      i.addCategory("android.intent.category.APP_MUSIC");
                      startActivity(i);
                  } catch (Exception e) {
                      new AlertDialog.Builder(this)
                          .setTitle("Music")
                          .setMessage("Music player not found.")
                          .setPositiveButton("OK", null).show();
                  }
              }

              void openApps() {
                  try {
                      startActivity(new Intent(
                          Settings.ACTION_MANAGE_APPLICATIONS_SETTINGS));
                  } catch (Exception e) {
                      openSettings();
                  }
              }

              void openSettings() {
                  try {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  } catch (Exception ignored) {}
              }

              void showAbout() {
                  new AlertDialog.Builder(this)
                      .setTitle("ATLAS G SPORT")
                      .setMessage(
                          "Version 2.0\n\n" +
                          "رابط کاربری اختصاصی سایپا اطلس G\n\n" +
                          "تیم طراحی مهندس زارع")
                      .setPositiveButton("بستن", null)
                      .show();
              }

              class Dashboard extends View {

                  Paint p = new Paint(3);
                  Bitmap car;

                  int cream = Color.rgb(232, 218, 188);
                  int gold = Color.rgb(190, 157, 99);
                  int black = Color.rgb(10, 11, 12);
                  int panel = Color.rgb(25, 25, 24);
                  int muted = Color.rgb(151, 145, 132);

                  float W, H;
                  long lastUpdate = 0;

                  Dashboard(Context context) {
                      super(context);
                      try {
                          car = BitmapFactory.decodeResource(
                              getResources(), R.drawable.atlas_car);
                      } catch (Exception ignored) {}
                  }

                  void paint(int color, float size) {
                      p.setColor(color);
                      p.setTextSize(size);
                      p.setTypeface(Typeface.create(
                          "sans-serif", Typeface.NORMAL));
                      p.setStyle(Paint.Style.FILL);
                      p.setTextAlign(Paint.Align.LEFT);
                  }

                  void text(Canvas c, String value, float x, float y,
                            int color, float size, Paint.Align align) {
                      paint(color, size);
                      p.setTextAlign(align);
                      c.drawText(value, x, y, p);
                  }

                  void round(Canvas c, float l, float t, float r, float b,
                             float radius, int color) {
                      paint(color, 1);
                      c.drawRoundRect(
                          l, t, r, b, radius, radius, p);
                  }

                  void line(Canvas c, float x1, float y1,
                            float x2, float y2, int color) {
                      paint(color, 1);
                      p.setStrokeWidth(2);
                      c.drawLine(x1, y1, x2, y2, p);
                  }

                  void drawCar(Canvas c, float l, float t,
                               float r, float b) {
                      if (car != null) {
                          float scale = Math.min(
                              (r-l)/car.getWidth(),
                              (b-t)/car.getHeight());

                          float dw = car.getWidth()*scale;
                          float dh = car.getHeight()*scale;

                          float x = l + ((r-l)-dw)/2;
                          float y = t + ((b-t)-dh)/2;

                          paint(Color.WHITE, 1);
                          p.setFilterBitmap(true);

                          c.drawBitmap(car, null,
                              new RectF(x, y, x+dw, y+dh), p);
                      } else {
                          text(c, "ATLAS G", (l+r)/2, (t+b)/2,
                              cream, 30, Paint.Align.CENTER);
                      }
                  }

                  void tire(Canvas c, float x, float y, String name) {
                      round(c, x-35, y-20, x+35, y+20, 9, black);
                      text(c, name, x, y+5, cream, 13,
                          Paint.Align.CENTER);
                      text(c, "-- bar", x, y+42, muted, 12,
                          Paint.Align.CENTER);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      W = getWidth();
                      H = getHeight();

                      c.drawColor(black);

                      float pad = Math.min(W, H)*0.025f;
                      float top = H*0.12f;
                      float bottom = H*0.16f;

                      // Top status bar
                      round(c, pad, pad, W-pad, top-pad/3, 18, panel);

                      text(c, "ATLAS G", pad*2, top*0.68f,
                          cream, 23, Paint.Align.LEFT);

                      text(c, "SPORT", pad*2+110, top*0.68f,
                          gold, 15, Paint.Align.LEFT);

                      String time = new SimpleDateFormat(
                          "HH:mm", Locale.getDefault()).format(new Date());

                      String date = new SimpleDateFormat(
                          "yyyy/MM/dd", Locale.getDefault()).format(new Date());

                      text(c, date, W/2, top*0.68f,
                          muted, 14, Paint.Align.CENTER);

                      text(c, time, W-pad*2, top*0.68f,
                          cream, 23, Paint.Align.RIGHT);

                      float mt = top+pad;
                      float mb = H-bottom-pad;

                      // Left panel
                      float left = W*0.19f;
                      float right = W*0.81f;

                      round(c, pad, mt, left-pad, mb, 18, panel);

                      text(c, "اطلاعات خودرو", left/2, mt+35,
                          cream, 16, Paint.Align.CENTER);

                      line(c, pad*2, mt+48, left-pad*2, mt+48, gold);

                      text(c, "سرعت خودرو", left/2, mt+85,
                          muted, 13, Paint.Align.CENTER);

                      text(c, speedText+" km/h", left/2, mt+130,
                          cream, 26, Paint.Align.CENTER);

                      text(c, gpsReady ? "GPS فعال" : "در انتظار GPS",
                          left/2, mt+160, gold, 12, Paint.Align.CENTER);

                      text(c, "آب‌وهوا", left/2, mt+215,
                          cream, 15, Paint.Align.CENTER);

                      text(c, "اتصال اینترنت لازم است",
                          left/2, mt+245, muted, 10, Paint.Align.CENTER);

                      // Main car panel
                      round(c, left, mt, right, mb, 20, panel);

                      text(c, "SAIPA ATLAS G",
                          W/2, mt+34, gold, 16, Paint.Align.CENTER);

                      drawCar(c, left+8, mt+42, right-8, mb-8);

                      // TPMS panel
                      round(c, right+pad, mt, W-pad, mb, 18, panel);

                      text(c, "فشار باد لاستیک",
                          (right+W)/2, mt+35, cream, 15,
                          Paint.Align.CENTER);

                      text(c, "نمایش آزمایشی",
                          (right+W)/2, mt+58, gold, 11,
                          Paint.Align.CENTER);

                      float cx = (right+W)/2;

                      tire(c, cx, mt+110, "FL");
                      tire(c, cx, mt+195, "RL");

                      text(c, "FR / RR",
                          cx, mb-12, muted, 10, Paint.Align.CENTER);

                      // Bottom dock
                      float dockTop = H-bottom;

                      round(c, pad, dockTop, W-pad, H-pad/2,
                          18, panel);

                      String[] labels = {
                          "نقشه", "موزیک", "برنامه‌ها",
                          "تنظیمات", "درباره"
                      };

                      for (int i=0; i<5; i++) {
                          float x = W*(i+0.5f)/5f;

                          round(c, x-W*0.075f, dockTop+8,
                              x+W*0.075f, H-pad, 12,
                              i==0 ? Color.rgb(55,46,32) : black);

                          text(c, labels[i], x,
                              dockTop+(H-dockTop)*0.65f,
                              cream, 15, Paint.Align.CENTER);
                      }

                      if (System.currentTimeMillis()-lastUpdate > 1000) {
                          lastUpdate = System.currentTimeMillis();
                          postInvalidateDelayed(1000);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          float x = event.getX();
                          float y = event.getY();

                          if (y > H-H*0.16f) {
                              int item = Math.min(4, Math.max(0,
                                  (int)(x/(W/5f))));

                              switch(item) {
                                  case 0: openMaps(); break;
                                  case 1: openMusic(); break;
                                  case 2: openApps(); break;
                                  case 3: openSettings(); break;
                                  case 4: showAbout(); break;
                              }
                          }
                          return true;
                      }
                      return true;
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-G-SPORT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
        
